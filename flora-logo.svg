<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110">
  <!-- Circle background -->
  <circle cx="55" cy="55" r="52" fill="#3B6E44"/>

  <!-- Large primary leaf — tall, tapered, central -->
  <path d="M55 16 C62 22 74 36 72 56 C70 70 63 78 55 80 C47 78 40 70 38 56 C36 36 48 22 55 16Z"
        fill="white"/>

  <!-- Small secondary leaf — lower left, softer -->
  <path d="M37 62 C26 57 18 44 23 32 C27 24 38 27 44 38 C50 49 47 64 38 65Z"
        fill="white" opacity="0.72"/>

  <!-- FLORA wordmark — heavy slab / condensed black -->
  <text x="122" y="68"
        font-family="'Arial Black','Franklin Gothic Heavy','Impact',sans-serif"
        font-size="60"
        font-weight="900"
        fill="#1C2A1E"
        letter-spacing="1">FLORA</text>

  <!-- Food Group sub-text — lighter, rounded -->
  <text x="126" y="92"
        font-family="'Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif"
        font-size="19"
        font-weight="400"
        fill="#1C2A1E"
        opacity="0.6"
        letter-spacing="0.5">Food Group&#8482;</text>
</svg>
